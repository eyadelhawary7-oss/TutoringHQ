name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # `labeled` lets the informational Playwright job be requested on a PR by
    # adding the `run-e2e` label (see the playwright-e2e job below).
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch: {}

# Cancel an older in-flight run on the same branch when a newer push arrives,
# instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build:
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  playwright-e2e:
    name: Playwright E2E (informational)
    runs-on: ubuntu-latest
    # Informational only (blocks nothing) and ~4 min per run, so it no longer
    # runs on ordinary pushes. It runs on demand: manually via workflow_dispatch,
    # or on a PR labelled `run-e2e` (add the label before merging to master).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        id: playwright
        continue-on-error: true
        run: npx playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
          TEST_SUPER_ADMIN_PHONE: ${{ secrets.TEST_SUPER_ADMIN_PHONE }}
          TEST_SUPER_ADMIN_PIN: ${{ secrets.TEST_SUPER_ADMIN_PIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report on failure
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci-yml
          path: playwright-report/
          retention-days: 7
