name: Live Schema Drift Check

# Scheduled, READ-ONLY check of the LIVE production schema against the committed
# snapshot. Catches a ghost object created directly on prod (dashboard / MCP /
# psql) — exactly the failure mode that left ~47 tables, 41 functions and 15
# triggers untracked. It NEVER mutates the database; on drift it fails the job
# (which notifies repo watchers) and prints a categorized diff.
#
# Requires a repo secret SCHEMA_DRIFT_DATABASE_URL — a READ-ONLY connection
# string to prod (a role with USAGE + SELECT on catalogs is sufficient). If the
# secret is absent the job FAILS LOUDLY (red, with an explanation) rather than
# skipping — a gate that silently no-ops reads as "green / passing" forever while
# never actually checking prod, which is exactly how drift goes unnoticed. A
# visible red here is the signal to wire up the read-only DSN (deferred to Eyad;
# we deliberately do NOT bake a DB credential into CI in this phase).

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  live-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require read-only prod DSN (FAIL loudly if missing)
        run: |
          if [ -z "${{ secrets.SCHEMA_DRIFT_DATABASE_URL }}" ]; then
            echo "::error title=Live drift check not configured::SCHEMA_DRIFT_DATABASE_URL is not set, so the live schema-drift gate CANNOT run. This job fails on purpose: a silent skip would show green while never checking prod for ghost objects. Add a READ-ONLY prod connection string as the SCHEMA_DRIFT_DATABASE_URL repo secret to enable it (a role with USAGE + SELECT on catalogs is enough)." >&2
            exit 1
          fi
          echo "SCHEMA_DRIFT_DATABASE_URL is set — proceeding with the live drift check."

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Introspect live prod (read-only) and diff vs committed snapshot
        env:
          DSN: ${{ secrets.SCHEMA_DRIFT_DATABASE_URL }}
        run: |
          chmod +x scripts/schema/check-drift.sh
          # Public-schema snapshot. Every dimension here — including table and
          # routine grants — is read from catalog columns any role can see, so a
          # plain read-only DSN reproduces the committed snapshot byte-for-byte.
          #
          # pg_cron jobs are deliberately NOT compared in this read-only run.
          # cron.job is RLS-gated (cron_job_policy: username = current_user) with
          # no RLS-free catalog mirror, so a read-only role sees zero rows and the
          # one prod job would false-trip as drift on every run. We do NOT grant
          # the drift role BYPASSRLS or any other elevated privilege just to read
          # it. cron.job is low-churn, changed only by a deliberate privileged
          # action, and introspect-cron.sql remains for an on-demand check run
          # with a privileged connection (see its header).
          psql "$DSN" -tAqX -f scripts/schema/introspect.sql > /tmp/live.snapshot
          echo "== public schema =="
          scripts/schema/check-drift.sh db/schema.snapshot /tmp/live.snapshot
