name: Live Schema Drift Check

# Scheduled, READ-ONLY check of the LIVE production schema against the committed
# snapshot. Catches a ghost object created directly on prod (dashboard / MCP /
# psql) — exactly the failure mode that left ~47 tables, 41 functions and 15
# triggers untracked. It NEVER mutates the database; on drift it fails the job
# (which notifies repo watchers) and prints a categorized diff.
#
# Requires a repo secret SCHEMA_DRIFT_DATABASE_URL — a READ-ONLY connection
# string to prod (a role with USAGE + SELECT on catalogs is sufficient). If the
# secret is absent the job is skipped rather than failing the org.

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  live-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require read-only prod DSN
        id: guard
        run: |
          if [ -z "${{ secrets.SCHEMA_DRIFT_DATABASE_URL }}" ]; then
            echo "SCHEMA_DRIFT_DATABASE_URL not set — skipping live drift check." >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install psql client
        if: steps.guard.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Introspect live prod (read-only) and diff vs committed snapshot
        if: steps.guard.outputs.run == 'true'
        env:
          DSN: ${{ secrets.SCHEMA_DRIFT_DATABASE_URL }}
        run: |
          chmod +x scripts/schema/check-drift.sh
          # public-schema snapshot
          psql "$DSN" -tAqX -f scripts/schema/introspect.sql > /tmp/live.snapshot
          # pg_cron jobs snapshot (operational; compared separately)
          psql "$DSN" -tAqX -f scripts/schema/introspect-cron.sql > /tmp/live.cron.snapshot || true

          status=0
          echo "== public schema =="
          scripts/schema/check-drift.sh db/schema.snapshot /tmp/live.snapshot || status=1
          if [ -f db/cron.snapshot ]; then
            echo "== pg_cron jobs =="
            if ! diff -u db/cron.snapshot /tmp/live.cron.snapshot; then
              echo "::warning::pg_cron jobs on prod differ from db/cron.snapshot" >&2
              status=1
            fi
          fi
          exit $status
