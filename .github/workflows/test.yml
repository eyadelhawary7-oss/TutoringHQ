name: Test Suite

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an older in-flight run on the same branch when a newer push arrives.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    name: i18n namespace parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ar.json root keys match en.json
        run: |
          node -e "
          const en = require('./messages/en.json');
          const ar = require('./messages/ar.json');
          const missing = Object.keys(en).filter(k => !(k in ar));
          if (missing.length) {
            console.error('❌ ar.json is missing namespaces:', missing.join(', '));
            process.exit(1);
          }
          console.log('✅ ar.json has all namespaces from en.json');
          "

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: i18n-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bidi + locale helper gates (Prompt 7)
        run: npm run check:bidi && npm run check:tolocale

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        id: playwright
        continue-on-error: true
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
          TEST_SUPER_ADMIN_PHONE: ${{ secrets.TEST_SUPER_ADMIN_PHONE }}
          TEST_SUPER_ADMIN_PIN: ${{ secrets.TEST_SUPER_ADMIN_PIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: steps.playwright.outcome == 'failure'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-audit:
    name: Security audit harness
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: ${{ github.event_name != 'pull_request' || !contains(join(github.event.pull_request.labels.*.name, ','), 'security-audit-skip') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security-audit.ts --all
        run: npx tsx scripts/security-audit.ts --all
        env:
          SECURITY_AUDIT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
