name: Test Suite

on:
  push:
    branches: [master]

jobs:
  i18n-check:
    name: i18n namespace parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ar.json root keys match en.json
        run: |
          node -e "
          const en = require('./messages/en.json');
          const ar = require('./messages/ar.json');
          const missing = Object.keys(en).filter(k => !(k in ar));
          if (missing.length) {
            console.error('❌ ar.json is missing namespaces:', missing.join(', '));
            process.exit(1);
          }
          console.log('✅ ar.json has all namespaces from en.json');
          "

  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: i18n-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  e2e-tests:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
          TEST_OWNER_PHONE: ${{ secrets.TEST_OWNER_PHONE }}
          TEST_OWNER_PIN: ${{ secrets.TEST_OWNER_PIN }}
          CI: true

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
